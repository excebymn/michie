name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Windows & macOS tidak kena bug EGL/Wayland ini (beda webview engine),
  # jadi tetap pakai tauri-action seperti biasa: build + bikin release + upload jadi satu step.
  release-others:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Michie ${{ github.ref_name }}
          releaseBody: |
            ## 🎵 Michie Beta

            Thanks for trying Michie!

            This is an early beta release.
            Bugs and unfinished features are expected.

            Please report issues on GitHub if you find one.
          prerelease: false
          releaseDraft: false
          # BARU: diubah dari false -> true. Ini yang bikin tauri-action generate
          # latest.json (manifest yang dibaca tauri-plugin-updater di app) dan
          # upload-nya ke release ini. Windows + macOS matrix jalan paralel dan
          # tauri-action sendiri yang urus penggabungan aman ke latest.json yang
          # sama (built-in buat kasus matrix multi-platform kayak gini).
          includeUpdaterJson: true

  # Linux: build manual (bukan lewat tauri-action) supaya kita bisa "operasi" AppImage-nya
  # sebelum diupload -- buang libwayland-* yang ke-bundle linuxdeploy, yang bentrok sama
  # Mesa/driver GPU host dan bikin webview gagal init EGL (EGL_BAD_PARAMETER) di banyak
  # compositor Wayland (niri, sway, KDE, dst). deb & rpm tidak kena masalah ini karena
  # keduanya pakai library sistem (lewat dependency apt/dnf), bukan lib yang dibundel.
  release-linux:
    needs: release-others
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            fuse

      - name: Install frontend dependencies
        run: npm install

      - name: Install tauri-cli
        run: npm install -g @tauri-apps/cli

      - name: Build (deb, rpm, appimage)
        # TAURI_SIGNING_PRIVATE_KEY WAJIB diisi di sini walau signature-nya bakal
        # basi habis AppImage di-patch di step berikutnya. Alasannya: begitu
        # tauri.conf.json punya plugins.updater.pubkey terisi, `tauri build`
        # otomatis coba sign appimage-nya -- kalau env ini kosong, build langsung
        # ERROR ("public key has been found, but no private key"), bukan cuma
        # skip signing. Jadi env ini di sini cuma buat lolos build; signature
        # yang bener/final dibuat ulang di step "Sign patched AppImage" di bawah,
        # SETELAH strip wayland selesai (lihat komentar di step itu).
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tauri build --bundles deb,rpm,appimage

      - name: Strip bundled libwayland-* from AppImage (fix EGL_BAD_PARAMETER on Wayland)
        run: |
          set -e
          BUNDLE_DIR="src-tauri/target/release/bundle/appimage"
          APPIMAGE_PATH=$(find "$BUNDLE_DIR" -maxdepth 1 -name "*.AppImage" | head -n1)
          echo "Ditemukan: $APPIMAGE_PATH"

          # Ambil appimagetool buat repack
          wget -q -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool

          # Extract AppImage lama
          chmod +x "$APPIMAGE_PATH"
          "$APPIMAGE_PATH" --appimage-extract
          mv squashfs-root AppDir

          # Buang lib wayland yang dibundel -- biarkan dynamic linker fallback ke lib sistem host
          rm -f AppDir/usr/lib/libwayland-client.so.0 \
                AppDir/usr/lib/libwayland-cursor.so.0 \
                AppDir/usr/lib/libwayland-egl.so.1 \
                AppDir/usr/lib/libwayland-egl.so.1.bak \
                AppDir/usr/lib/libwayland-server.so.0

          # Repack jadi AppImage baru dengan nama file yang sama (replace)
          rm "$APPIMAGE_PATH"
          ./appimagetool AppDir "$APPIMAGE_PATH"
          chmod +x "$APPIMAGE_PATH"
          echo "AppImage sudah di-patch: $APPIMAGE_PATH"

          # Simpan path-nya buat dipakai step-step selanjutnya di job ini
          echo "APPIMAGE_PATH=$APPIMAGE_PATH" >> "$GITHUB_ENV"

      # BARU: re-sign AppImage yang SUDAH di-patch. Ini WAJIB dan urutannya
      # harus setelah strip, bukan sebelumnya -- signature dihitung dari byte
      # file, jadi kalau di-sign sebelum patch, hasilnya gak akan cocok lagi
      # sama file yang beneran diupload/diinstall user.
      - name: Sign patched AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          npx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$APPIMAGE_PATH"
          echo "APPIMAGE_SIG=$(cat "$APPIMAGE_PATH.sig")" >> "$GITHUB_ENV"

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: true
          draft: false
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

      # BARU: gabungkan entry Linux ke latest.json yang sudah dibuat job
      # release-others (job ini "needs: release-others" jadi manifest itu
      # dijamin sudah ada). rpm/deb sengaja TIDAK dimasukkan -- tauri-plugin-updater
      # cuma bisa auto-update lewat AppImage di Linux, bukan rpm/deb.
      - name: Merge Linux entry into latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"

          gh release download "$TAG" -R "$REPO" -p "latest.json" --clobber

          FILENAME=$(basename "$APPIMAGE_PATH")
          URL="https://github.com/$REPO/releases/download/$TAG/$FILENAME"

          jq --arg sig "$APPIMAGE_SIG" --arg url "$URL" \
            '.platforms["linux-x86_64"] = {"signature": $sig, "url": $url}' \
            latest.json > latest.json.new
          mv latest.json.new latest.json

          gh release upload "$TAG" latest.json -R "$REPO" --clobber