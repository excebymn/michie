[package]
name = "michie"
version = "0.1.0"
description = "Offline Music Library Player (Tauri + React)"
authors = ["you"]
edition = "2021"

[lib]
name = "michie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# =========================
# BUILD DEPENDENCIES
# =========================
[build-dependencies]
tauri-build = { version = "2", features = [] }

# =========================
# ALL DEPENDENCIES (DIGABUNG JADI SATU)
# =========================
[dependencies]
# Tauri Core
tauri = { version = "2", features = [] }

# Tauri Plugins
tauri-plugin-sql    = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs     = "2"
tauri-plugin-shell  = "2"
tauri-plugin-opener = "2"

# Music / Metadata
lofty = "0.21"
notify = "6"
image = "0.25"
walkdir = "2"                    # ← UNTUK SCAN FOLDER REKURSIF
chrono = { version = "0.4", features = ["serde"] }  # ← UNTUK TIMESTAMP

# Async Runtime
tokio = { version = "1", features = ["full"] }

# Utils
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
